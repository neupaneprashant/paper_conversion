const TextLines = ({ count = 6, seed = 0, compact = false }) => {

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: compact ? 2 : 2.5 }}>
      {Array.from({ length: count }).map((_, i) => {
        const w = WS[(i + seed) % WS.length];

          ? <div key={i} style={{ height: compact ? 3 : 4 }} />
          : <div key={i} style={{ height: compact ? 2.5 : 3, background: T.rule, width: `${w}%` }} />;

};

  }, []);
  React.useEffect(() => {
    setDir(d => d === 'ieee-acm' ? 'acm-ieee' : 'ieee-acm');

  const ieeeLeft = dir === 'ieee-acm';

  return (
    <div style={{ position: 'relative', paddingTop: 30 }}>

// Turn an uploaded filename into a presentable display title.
// "Edge_Oriented_Redistribution_of_Computational_Load_for_Authentication_Systems.pdf"
//   → "Edge Oriented Redistribution of Computational Load for Authentication Systems"
// Drops the extension, normalises separators, strips any leading "arxiv-" /
// version suffixes, and lower-cases the small connector words for a more
// natural-looking heading.
const titleFromFilename = (raw) => {
  if (!raw) return '';
  let name = String(raw).trim();
  name = name.replace(/\.(pdf|tex|zip|tar|gz|tgz)$/i, '');
  name = name.replace(/^(?:arxiv[-_]?|preprint[-_]?)/i, '');
  name = name.replace(/[-_]+/g, ' ');
  name = name.replace(/\s+v?\d+(\.\d+)*$/i, '');     // "...paper v2" → "...paper"
  name = name.replace(/\s+/g, ' ').trim();
  if (!name) return '';
  const small = new Set(['of','for','and','the','in','on','to','a','an','via','with','from']);
  return name.split(' ').map((w, i) => {
    const lower = w.toLowerCase();
    if (i > 0 && small.has(lower)) return lower;
    if (w.length <= 3 && /^[A-Z]+$/.test(w)) return w; // keep acronyms uppercase
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
};

              fontFamily: "'Source Serif 4', serif", fontSize: 16, fontWeight: 600,

              <span style={{ display: 'inline-block', height: 14, width: '70%',
                background: T.rule, opacity: 0.6 }} />

            <div style={{ fontSize: 10, color: T.muted, marginTop: 5, fontStyle: 'italic',
              textAlign: to === 'IEEE' ? 'center' : 'left', minHeight: 12 }}>

                  shimmer line instead of a fabricated byline so the preview
                  always reflects what we actually know. */}

                background: T.rule, opacity: 0.5 }} />
            </div>

              display: 'grid', gridTemplateColumns: to === 'IEEE' ? '1fr 1fr' : '1fr',
              gap: to === 'IEEE' ? 10 : 0, marginTop: 12,
            }}>

                <div key={ci} style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  <div style={{
                    fontFamily: "'IBM Plex Mono', monospace", fontSize: 8,

                  {Array.from({ length: 12 }).map((_, i) => (
                    <div key={i} style={{ height: 4, background: T.rule, width: `${62 + ((i*9+ci*3)%34)}%` }} />
                  ))}
                  <div style={{
                    marginTop: 7, height: 46,
                    background: `repeating-linear-gradient(135deg,${T.creamDeep} 0 5px,${T.paper} 5px 10px)`,
                    border: `1px solid ${T.rule}`, display: 'grid', placeItems: 'center',
                  }}>
                    <Folio style={{ fontSize: 8 }}>FIG. {ci+1}</Folio>
                  </div>
                  {Array.from({ length: 5 }).map((_, i) => (
                    <div key={i} style={{ height: 4, background: T.rule, width: `${55+((i*13+ci*5)%40)}%` }} />
                  ))}
                </div>
              ))}
            </div>
          </div>
          {stage === 'done' && jobId && (
            <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${T.rule}` }}>
              <a href={`/job.html?job=${encodeURIComponent(jobId)}`} style={{
                display: 'inline-block', padding: '11px 18px',
                background: T.ink, color: T.paper,
                fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                letterSpacing: '0.12em', textTransform: 'uppercase', textDecoration: 'none',
              }}>View job &amp; download →</a>

const ConverterWidget = ({ accent }) => {
  const [stage, setStage]   = React.useState('idle');
  const [progress, setProgress] = React.useState(0);
  const [from, setFrom]     = React.useState('IEEE');
  const [to, setTo]         = React.useState('ACM');
  const [filename, setFilename] = React.useState('');
  const [dragOver, setDragOver] = React.useState(false);
  const [jobId, setJobId]   = React.useState(null);
  const [errMsg, setErrMsg] = React.useState('');
  const [isPdf, setIsPdf]   = React.useState(false);
  const fileRef  = React.useRef(null);
  const folderRef = React.useRef(null);
  const pollRef  = React.useRef(null);
  const progRef  = React.useRef(null);

  const swap = () => { setFrom(f => f === 'IEEE' ? 'ACM' : 'IEEE'); setTo(t => t === 'ACM' ? 'IEEE' : 'ACM'); };

  const reset = () => {
    setStage('idle'); setProgress(0); setFilename(''); setJobId(null); setErrMsg(''); setIsPdf(false);
    clearInterval(pollRef.current); clearInterval(progRef.current);
  };

  const startProgress = () => {
    clearInterval(progRef.current);
    progRef.current = setInterval(() => {
      setProgress(p => p >= 90 ? 90 : p + (0.8 + Math.random() * 1.5));
    }, 200);
  };

  const stopProgress = (final = 100) => {
    clearInterval(progRef.current);
    setProgress(final);
  };

  const startPolling = (id) => {
    clearInterval(pollRef.current);
    pollRef.current = setInterval(async () => {
      try {
        const res  = await fetch('/api/jobs');
        const jobs = await res.json();
        const job  = Array.isArray(jobs) ? jobs.find(j => j.job_id === id) : null;
        if (!job) return;

        // Terminal: failed
        if (job.status === 'failed' || job.status === 'error') {
          stopProgress(0);
          setStage('error');
          setErrMsg(job.error?.message || 'Conversion failed');
          clearInterval(pollRef.current);
          return;
        }

        // Terminal: success (backend uses 'success', not 'done')
        if (job.status === 'success') {
          stopProgress(100);
          setStage('done');
          clearInterval(pollRef.current);
          return;
        }

        // In-progress: map backend stage names to UI stages
        const map = {
          upload: 'uploading', queued: 'uploading',
          parse: 'parsing', cpr: 'parsing', pdf_ingest: 'parsing',
          recompose: 'recomposing', harmonize: 'recomposing',
          compile: 'recomposing', validate: 'recomposing',
          repair_1: 'repairing', repair_2: 'repairing', package: 'recomposing',
        };
        const mapped = map[(job.stage || '').toLowerCase()] || 'parsing';
        setStage(mapped);
      } catch { /* network blip — keep polling */ }
    }, 1500);
  };

  React.useEffect(() => () => { clearInterval(pollRef.current); clearInterval(progRef.current); }, []);

  const uploadManuscript = async (file, displayName) => {
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','tex','zip'].includes(ext)) { alert('Please upload a PDF, .tex, or ZIP file.'); return; }

    setIsPdf(ext === 'pdf');
    setFilename(displayName || file.name);
    setStage('uploading');
    setProgress(0);
    setJobId(null);
    setErrMsg('');
    startProgress();

    const fd = new FormData();
    fd.append('file', file);
    fd.append('source_format', from.toLowerCase());
    fd.append('target_format', to.toLowerCase());

    try {
      const res  = await fetch('/api/jobs', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
      setJobId(data.job_id);
      setStage('parsing');
      startPolling(data.job_id);
    } catch (err) {
      stopProgress(0);
      setStage('error');
      setErrMsg(err.message);
    }
  };

  const handleFile = async (file) => uploadManuscript(file, file?.name);

  const zipFolderFiles = async (files) => {
    const selected = Array.from(files || []);
    if (!selected.length) return null;
    if (!window.JSZip) {
      throw new Error('Folder upload support did not load. Please zip the folder manually and upload the .zip file.');
    }
    const zip = new JSZip();
    let root = 'latex-project';
    for (const file of selected) {
      const rel = file.webkitRelativePath || file.name;
      const first = rel.split('/')[0];
      if (first) { root = first; break; }
    }
    for (const file of selected) {
      const rel = file.webkitRelativePath || `${root}/${file.name}`;
      if (!rel || file.name === '.DS_Store') continue;
      zip.file(rel, file);
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    return new File([blob], `${root}.zip`, { type: 'application/zip' });
  };

  const handleFolder = async (files) => {
    try {
      const zipFile = await zipFolderFiles(files);
      if (zipFile) await uploadManuscript(zipFile, `${zipFile.name} (folder upload)`);
    } catch (err) {
      setStage('error');
      setErrMsg(err.message);
    } finally {
      if (folderRef.current) folderRef.current.value = '';
    }
  };

  const stageLabel = {
    idle:        'Awaiting manuscript',
    uploading:   'Uploading…',
    parsing:     'Parsing document tree (CPR)…',
    recomposing: `Recomposing into ${to} template… (LLM — may take 3–5 min)`,
    repairing:   'Repairing LaTeX (LLM self-correction)…',
    done:        'Conversion complete',
    error:       errMsg || 'Error',
  }[stage] || 'Processing…';

  return (
    <section id="convert" style={{ padding: '60px 64px', background: T.cream }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 18 }}>
        <div>
          <Folio>§ II · Live proof</Folio>
          <h2 style={{
            fontFamily: "'Source Serif 4', serif", fontSize: 44,
            margin: '8px 0 0', fontWeight: 450, letterSpacing: '-0.02em',
          }}>Try it on your manuscript.</h2>
        </div>
        <div style={{
          fontFamily: "'Spectral', serif", fontStyle: 'italic',
          color: T.muted, fontSize: 14, maxWidth: 280, textAlign: 'right',
        }}>Upload <code style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>.tex</code> or <code style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>.zip</code> for best results. PDF accepted with reduced fidelity.</div>
      </div>
      <Rule thick />

      <div style={{ marginTop: 26, display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 24 }}>
        {/* Left panel */}
        <div style={{
          background: T.paper, border: `1px solid ${T.ink}`,
          padding: 26, display: 'flex', flexDirection: 'column', gap: 18,
        }}>
          {/* Direction row */}
          <div>
            <Folio style={{ marginBottom: 8 }}>Direction</Folio>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <TemplatePill label={from} dark />
              <button onClick={swap} disabled={stage !== 'idle'} style={{
                width: 34, height: 34, borderRadius: '50%',
                border: `1px solid ${T.ink}`, background: T.paper, color: T.ink,
                fontSize: 14, display: 'grid', placeItems: 'center',
                cursor: stage === 'idle' ? 'pointer' : 'not-allowed',
                opacity: stage === 'idle' ? 1 : 0.35,
              }}>⇌</button>
              <TemplatePill label={to} accent={accent} />
              <div style={{ flex: 1 }} />
              <Folio>10 MB · PDF / 50 MB · ZIP</Folio>
            </div>
          </div>

          {/* Drop zone */}
          <input ref={fileRef} type="file" accept=".pdf,.tex,.zip" style={{ display:'none' }}
            onChange={e => { if (e.target.files[0]) handleFile(e.target.files[0]); }} />
          <input ref={folderRef} type="file" webkitdirectory="true" directory="true" multiple style={{ display:'none' }}
            onChange={e => { if (e.target.files.length) handleFolder(e.target.files); }} />

          <div
            onDragOver={e => { e.preventDefault(); if (stage === 'idle') setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); if (stage === 'idle' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }}
            style={{
              flex: 1, minHeight: 220,
              border: `2px dashed ${dragOver ? accent : T.rule}`,
              background: dragOver ? T.creamDeep : 'transparent',
              padding: 22, display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center', gap: 12,
              cursor: stage === 'idle' ? 'pointer' : 'default',
              transition: 'all 180ms ease',
            }}>
            {stage === 'idle' && (<>
              <div style={{
                fontFamily: "'Source Serif 4', serif", fontSize: 50,
                color: accent, lineHeight: 1, fontStyle: 'italic',
              }}>¶</div>
              <div style={{
                fontFamily: "'Source Serif 4', serif", fontSize: 20,
                fontWeight: 500, color: T.ink, textAlign: 'center',
              }}>Drop a manuscript, or choose a file or folder</div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
                <button type="button" onClick={() => fileRef.current?.click()} style={{
                  padding: '10px 14px', background: T.ink, color: T.paper,
                  border: `1px solid ${T.ink}`, cursor: 'pointer',
                  fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                  letterSpacing: '0.12em', textTransform: 'uppercase',
                }}>Select file</button>
                <button type="button" onClick={() => folderRef.current?.click()} style={{
                  padding: '10px 14px', background: 'transparent', color: T.ink,
                  border: `1px solid ${T.ink}`, cursor: 'pointer',
                  fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                  letterSpacing: '0.12em', textTransform: 'uppercase',
                }}>Select folder</button>
              </div>
              <Folio>.tex · .zip · .pdf · folders auto-zipped · 10 MB PDF / 50 MB ZIP</Folio>
            </>)}

            {stage !== 'idle' && (
              <div style={{ width: '100%' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 7, flexWrap: 'wrap', gap: 4 }}>
                  <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: 15, fontWeight: 500, wordBreak: 'break-all' }}>
                    {filename}
                  </div>
                  <Folio style={{ color: stage === 'error' ? T.rust : T.muted }}>
                    {stageLabel}
                  </Folio>
                </div>

                {isPdf && stage !== 'done' && stage !== 'error' && (
                  <div style={{
                    marginTop: 10, padding: '9px 12px',
                    background: '#FDF3DC', border: '1px solid #E8C84A',
                    display: 'flex', gap: 8, alignItems: 'flex-start',
                  }}>
                    <span style={{ fontSize: 13, lineHeight: 1 }}>⚠</span>
                    <div style={{ fontFamily: "'Spectral', serif", fontSize: 12, lineHeight: 1.45, color: '#5C4A00' }}>
                      <strong>PDF mode:</strong> text is extracted from the rendered file — math formatting and custom macros may degrade.
                      For best results, upload the original <code style={{ fontFamily: "'IBM Plex Mono', monospace" }}>.tex</code> source or a <code style={{ fontFamily: "'IBM Plex Mono', monospace" }}>.zip</code> of your LaTeX project.
                    </div>
                  </div>
                )}

                {stage !== 'error' && (
                  <div style={{ height: 5, background: T.rule, overflow: 'hidden', marginTop: isPdf ? 8 : 0 }}>
                    <div style={{
                      height: '100%', width: `${stage === 'done' ? 100 : progress}%`,
                      background: accent, transition: 'width 180ms linear',
                    }} />
                  </div>
                )}

                {stage !== 'error' && (
                  <div style={{ display: 'flex', marginTop: 16 }}>
                    {['uploading','parsing','recomposing','done'].map((s, i) => {
                      const order  = ['uploading','parsing','recomposing','done'];
                      const active = order.indexOf(stage) >= i;
                      return (
                        <div key={s} style={{
                          flex: 1, paddingTop: 8,
                          borderTop: `2px solid ${active ? accent : T.rule}`,
                        }}>
                          <Folio style={{ color: active ? T.ink : T.muted, fontSize: 9 }}>
                            {String(i+1).padStart(2,'0')} · {s === 'done' ? 'Ready' : s}
                          </Folio>
                        </div>
                      );
                    })}
                  </div>
                )}

                {stage === 'done' && jobId && (
                  <div style={{ marginTop: 16 }}>
                    {/* ZIP — primary recommended download */}
                    <a href={`/job.html?job=${encodeURIComponent(jobId)}`}
                      style={{
                        display: 'block', padding: '13px 16px',
                        background: accent, color: T.paper,
                        fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                        letterSpacing: '0.12em', textTransform: 'uppercase',
                        textDecoration: 'none', textAlign: 'center', marginBottom: 4,
                      }}>↓ Download ZIP bundle · View full job →</a>
                    <div style={{
                      fontFamily: "'Spectral', serif", fontStyle: 'italic',
                      fontSize: 11, color: T.muted, textAlign: 'center', marginBottom: 10,
                    }}>
                      Recommended — full LaTeX project with all assets. Best structural consistency for re-submission.
                    </div>

                    {/* PDF + .tex secondary row */}
                    <div style={{ display: 'flex', gap: 8 }}>
                      <div style={{ flex: 1 }}>
                        <a href={`/api/jobs/${encodeURIComponent(jobId)}/artifact/main.pdf`}
                          download="converted.pdf"
                          style={{
                            display: 'block', padding: '10px', background: T.ink, color: T.paper,
                            fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                            letterSpacing: '0.12em', textTransform: 'uppercase',
                            textDecoration: 'none', textAlign: 'center',
                          }}>↓ PDF</a>
                        <div style={{
                          fontFamily: "'Spectral', serif", fontStyle: 'italic',
                          fontSize: 10, color: T.muted, textAlign: 'center', marginTop: 3,
                          lineHeight: 1.3,
                        }}>Quick preview · consistency not guaranteed</div>
                      </div>
                      <div style={{ flex: 1 }}>
                        <a href={`/api/jobs/${encodeURIComponent(jobId)}/artifact/main.tex`}
                          download="main.tex"
                          style={{
                            display: 'block', padding: '10px', background: 'transparent', color: T.ink,
                            border: `1px solid ${T.ink}`,
                            fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                            letterSpacing: '0.12em', textTransform: 'uppercase',
                            textDecoration: 'none', textAlign: 'center',
                          }}>↓ .tex source</a>
                        <div style={{
                          fontFamily: "'Spectral', serif", fontStyle: 'italic',
                          fontSize: 10, color: T.muted, textAlign: 'center', marginTop: 3,
                          lineHeight: 1.3,
                        }}>Main file only · no assets</div>
                      </div>
                      <button onClick={reset} style={{
                        padding: '10px 14px', background: 'transparent',
                        color: T.muted, border: `1px solid ${T.rule}`,
                        cursor: 'pointer', fontFamily: "'IBM Plex Mono', monospace", fontSize: 13,
                        alignSelf: 'flex-start',
                      }}>↻</button>
                    </div>
                  </div>
                )}

                {stage === 'error' && (
                  <button onClick={reset} style={{
                    marginTop: 14, padding: '11px 20px', background: T.ink, color: T.paper,
                    border: 'none', cursor: 'pointer',
                    fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                    letterSpacing: '0.12em', textTransform: 'uppercase',
                  }}>Try again</button>
                )}
              </div>
            )}
          </div>
        </div>

        {/* Proof panel */}
        <ProofPanel stage={stage} to={to} accent={accent} progress={progress} jobId={jobId} filename={filename} />
      </div>
    </section>
  );
};

const BeforeAfter = ({ accent }) => {
  const [split, setSplit]     = React.useState(0.5);
  const [dragging, setDragging] = React.useState(false);
  const ref = React.useRef(null);

  const update = (clientX) => {
    if (!ref.current) return;
    const r = ref.current.getBoundingClientRect();
    setSplit(Math.max(0.06, Math.min(0.94, (clientX - r.left) / r.width)));
  };

  return (
    <section id="compare" style={{ padding: '72px 64px', background: T.cream }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 22 }}>
        <div>
          <Folio>§ IV · Comparison</Folio>
          <h2 style={{
            fontFamily: "'Source Serif 4', serif", fontSize: 44,
            margin: '8px 0 0', fontWeight: 450, letterSpacing: '-0.02em',
          }}>Before &amp; after, side by side.</h2>
        </div>
        <Folio>Drag the rule →</Folio>
      </div>

      <div
        ref={ref}
        onMouseMove={e => dragging && update(e.clientX)}
        onMouseUp={() => setDragging(false)}
        onMouseLeave={() => setDragging(false)}
        onTouchMove={e => { e.preventDefault(); dragging && update(e.touches[0].clientX); }}
        onTouchEnd={() => setDragging(false)}
        style={{
          position: 'relative', height: 500, border: `1px solid ${T.ink}`,
          overflow: 'hidden', cursor: dragging ? 'ew-resize' : 'col-resize',
          userSelect: 'none', touchAction: 'none',
        }}>
        {/* AFTER (ACM) — behind */}
        <div style={{ position: 'absolute', inset: 0 }}>
          <ComparePage variant="acm" accent={accent} />
        </div>
        {/* BEFORE (IEEE) — clipped */}
        <div style={{ position: 'absolute', inset: 0, clipPath: `inset(0 ${(1-split)*100}% 0 0)` }}>
          <ComparePage variant="ieee" accent={accent} />
        </div>
        {/* Divider */}
        <div style={{ position: 'absolute', top: 0, bottom: 0, left: `${split*100}%`, width: 1, background: T.ink, pointerEvents: 'none' }} />
        {/* Handle */}
        <div
          onMouseDown={() => setDragging(true)}
          onTouchStart={() => setDragging(true)}
          style={{
            position: 'absolute', top: '50%', left: `${split*100}%`,
            transform: 'translate(-50%,-50%)',
            width: 50, height: 50, borderRadius: '50%',
            background: accent, color: T.paper,
            border: `2px solid ${T.ink}`, cursor: 'ew-resize',
            display: 'grid', placeItems: 'center',
            fontSize: 16, fontWeight: 700, zIndex: 10,
            boxShadow: '0 2px 10px rgba(0,0,0,0.25)',
          }}>⇌</div>
        {/* Labels */}
        <div style={{
          position: 'absolute', top: 12, left: 14,
          background: T.ink, color: T.paper, padding: '5px 10px',
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: '0.16em',
          pointerEvents: 'none',
        }}>IEEE · Before</div>
        <div style={{
          position: 'absolute', top: 12, right: 14,
          background: accent, color: T.paper, padding: '5px 10px',
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: '0.16em',
          pointerEvents: 'none',
        }}>ACM · After</div>
      </div>
    </section>
  );
};
